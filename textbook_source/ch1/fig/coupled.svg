<svg width="580" height="250" viewBox="0 0 580 250" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR" font-size="11"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a9f"/></marker><marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/></marker><marker id="aho" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e08a1e"/></marker></defs><text x="290" y="16" text-anchor="middle" fill="#1b3a5c" font-size="10.5" font-weight="bold">물리학도용 비유: 결합된 진자. 연결하면 진동수가 갈라진다</text><text x="84" y="40" text-anchor="middle" fill="#2d6a9f" font-size="9.5" font-weight="bold">같은 방향으로 흔들림</text><line x1="30" y1="50" x2="104" y2="50" stroke="#555" stroke-width="2"/><line x1="40" y1="50" x2="50" y2="115" stroke="#555" stroke-width="1.2"/><circle cx="50" cy="120" r="8" fill="#2d6a9f" stroke="none" stroke-width="1"/><path d="M58,100 l3.5,5 l3.5,-5 l3.5,5 l3.5,-5 l3.5,5 l3.5,-5 l3.5,5 l3.5,-5" fill="none" fill-opacity="1" stroke="#e08a1e" stroke-width="1.2"/><line x1="84" y1="50" x2="94" y2="115" stroke="#555" stroke-width="1.2"/><circle cx="94" cy="120" r="8" fill="#2d6a9f" stroke="none" stroke-width="1"/><text x="73" y="148" text-anchor="middle" fill="#333" font-size="8.5">스프링이 안 늘어남 → 느림 (낮은 진동수)</text><text x="264" y="40" text-anchor="middle" fill="#c0392b" font-size="9.5" font-weight="bold">반대 방향으로 흔들림</text><line x1="210" y1="50" x2="284" y2="50" stroke="#555" stroke-width="2"/><line x1="220" y1="50" x2="230" y2="115" stroke="#555" stroke-width="1.2"/><circle cx="230" cy="120" r="8" fill="#c0392b" stroke="none" stroke-width="1"/><path d="M238,100 l1.0,5 l1.0,-5 l1.0,5 l1.0,-5 l1.0,5 l1.0,-5 l1.0,5 l1.0,-5" fill="none" fill-opacity="1" stroke="#e08a1e" stroke-width="1.2"/><line x1="264" y1="50" x2="254" y2="115" stroke="#555" stroke-width="1.2"/><circle cx="254" cy="120" r="8" fill="#c0392b" stroke="none" stroke-width="1"/><text x="253" y="148" text-anchor="middle" fill="#333" font-size="8.5">스프링이 늘어남 → 빠름 (높은 진동수)</text><text x="450" y="40" text-anchor="middle" fill="#1b3a5c" font-size="9.5" font-weight="bold">진자 N개를 연결하면</text><line x1="395" y1="60" x2="505" y2="60" stroke="#2d6a9f" stroke-width="1.2"/><line x1="395" y1="66" x2="505" y2="66" stroke="#2d6a9f" stroke-width="1.2"/><line x1="395" y1="72" x2="505" y2="72" stroke="#2d6a9f" stroke-width="1.2"/><line x1="395" y1="78" x2="505" y2="78" stroke="#2d6a9f" stroke-width="1.2"/><line x1="395" y1="84" x2="505" y2="84" stroke="#2d6a9f" stroke-width="1.2"/><line x1="395" y1="90" x2="505" y2="90" stroke="#2d6a9f" stroke-width="1.2"/><line x1="395" y1="96" x2="505" y2="96" stroke="#c0392b" stroke-width="1.2"/><line x1="395" y1="102" x2="505" y2="102" stroke="#c0392b" stroke-width="1.2"/><line x1="395" y1="108" x2="505" y2="108" stroke="#c0392b" stroke-width="1.2"/><line x1="395" y1="114" x2="505" y2="114" stroke="#c0392b" stroke-width="1.2"/><line x1="395" y1="120" x2="505" y2="120" stroke="#c0392b" stroke-width="1.2"/><line x1="395" y1="126" x2="505" y2="126" stroke="#c0392b" stroke-width="1.2"/><text x="450" y="148" text-anchor="middle" fill="#333" font-size="8.5">진동 모드 N개가 촘촘히 → 띠</text><line x1="15" y1="165" x2="565" y2="165" stroke="#ddd" stroke-width="1"/><text x="20" y="185" text-anchor="start" fill="#333" font-size="9">진자 하나의 진동수 = 원자의 준위 하나.  스프링 = 파동함수의 겹침(결합).</text><text x="20" y="202" text-anchor="start" fill="#333" font-size="9">진자 2개를 이으면 "같이 흔들림 / 엇갈려 흔들림" 두 모드가 생기고 진동수가 위아래로 갈라진다 (결합 / 반결합).</text><text x="20" y="219" text-anchor="start" fill="#333" font-size="9">진자 N개면 모드도 정확히 N개다. 모드 수는 진자 수를 넘지도 모자라지도 않는다 → 원자 N개 = 상태 N개.</text><text x="20" y="236" text-anchor="start" fill="#333" font-size="9">스프링이 셀수록(원자가 가까울수록) 진동수가 더 크게 갈라진다 → 결합이 강할수록 갭이 크다 (1.1.4).</text></svg>