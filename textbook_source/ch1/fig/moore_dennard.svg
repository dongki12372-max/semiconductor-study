<svg width="580" height="250" viewBox="0 0 580 250" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR" font-size="11"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2d6a9f"/></marker><marker id="ahk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker><marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/></marker><marker id="aho" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e08a1e"/></marker></defs><rect x="15" y="30" width="170" height="95" rx="8" fill="#fff4e5" fill-opacity="1" stroke="#e08a1e" stroke-width="1.2"/><text x="100" y="52" text-anchor="middle" fill="#e08a1e" font-size="11" font-weight="bold">무어의 법칙</text><text x="100" y="72" text-anchor="middle" fill="#333" font-size="9.3">"칩당 트랜지스터 수가</text><text x="100" y="87" text-anchor="middle" fill="#333" font-size="9.3">약 2년마다 2배"</text><text x="100" y="102" text-anchor="middle" fill="#333" font-size="9.3">= 관찰이자 업계의 목표</text><rect x="205" y="30" width="170" height="95" rx="8" fill="#eef4fa" fill-opacity="1" stroke="#2d6a9f" stroke-width="1.2"/><text x="290" y="52" text-anchor="middle" fill="#2d6a9f" font-size="11" font-weight="bold">스케일링</text><text x="290" y="72" text-anchor="middle" fill="#333" font-size="9.3">트랜지스터를 작게 만들기</text><text x="290" y="87" text-anchor="middle" fill="#333" font-size="9.3">= 목표를 달성하는</text><text x="290" y="102" text-anchor="middle" fill="#333" font-size="9.3">주된 수단</text><rect x="395" y="30" width="170" height="95" rx="8" fill="#eef7ee" fill-opacity="1" stroke="#2e8b57" stroke-width="1.2"/><text x="480" y="52" text-anchor="middle" fill="#2e8b57" font-size="11" font-weight="bold">데너드 스케일링</text><text x="480" y="72" text-anchor="middle" fill="#333" font-size="9.3">작게 만들면 왜 이득인가</text><text x="480" y="87" text-anchor="middle" fill="#333" font-size="9.3">= 같은 전력 밀도로</text><text x="480" y="102" text-anchor="middle" fill="#333" font-size="9.3">더 빠르고 싸진다는 규칙</text><line x1="203" y1="78" x2="188" y2="78" stroke="#333" stroke-width="1.5" marker-end="url(#ahk)"/><text x="196" y="140" text-anchor="middle" fill="#333" font-size="9">수단</text><line x1="393" y1="78" x2="378" y2="78" stroke="#333" stroke-width="1.5" marker-end="url(#ahk)"/><text x="386" y="140" text-anchor="middle" fill="#333" font-size="9">근거</text><line x1="40" y1="190" x2="560" y2="190" stroke="#333" stroke-width="1.2" marker-end="url(#ahk)"/><line x1="40.0" y1="186" x2="40.0" y2="194" stroke="#333" stroke-width="1"/><text x="40.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">1970</text><line x1="125.0" y1="186" x2="125.0" y2="194" stroke="#333" stroke-width="1"/><text x="125.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">1980</text><line x1="210.0" y1="186" x2="210.0" y2="194" stroke="#333" stroke-width="1"/><text x="210.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">1990</text><line x1="295.0" y1="186" x2="295.0" y2="194" stroke="#333" stroke-width="1"/><text x="295.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">2000</text><line x1="380.0" y1="186" x2="380.0" y2="194" stroke="#333" stroke-width="1"/><text x="380.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">2010</text><line x1="465.0" y1="186" x2="465.0" y2="194" stroke="#333" stroke-width="1"/><text x="465.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">2020</text><line x1="550.0" y1="186" x2="550.0" y2="194" stroke="#333" stroke-width="1"/><text x="550.0" y="208" text-anchor="middle" fill="#555" font-size="8.5">2030</text><rect x="74.0" y="162" width="263.5" height="14" rx="0" fill="#2e8b57" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="205.75" y="173" text-anchor="middle" fill="white" font-size="8.5" font-weight="bold">데너드 유효: 작게 = 빠르고 저전력</text><rect x="337.5" y="162" width="195.5" height="14" rx="0" fill="#c9cfd6" fill-opacity="1" stroke="none" stroke-width="0"/><text x="435.25" y="173" text-anchor="middle" fill="#333" font-size="8.5" font-weight="bold">전압 못 줄임 → 클럭 정체</text><rect x="48.5" y="145" width="484.5" height="14" rx="0" fill="#e08a1e" fill-opacity="0.5" stroke="none" stroke-width="0"/><text x="290.75" y="156" text-anchor="middle" fill="#333" font-size="8.5" font-weight="bold">무어의 법칙: 계속 (속도는 점점 둔화)</text><text x="290" y="232" text-anchor="middle" fill="#555" font-size="9">2005년 무렵 이후: 작게 만드는 이득이 줄자 멀티코어 · 새 구조(FinFET, GAA) · 3D 적층으로 무어의 법칙을 이어감</text></svg>