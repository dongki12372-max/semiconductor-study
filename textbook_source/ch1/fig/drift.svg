"none" stroke-width="1"/><text x="140" y="61.09090909090909" text-anchor="middle" fill="white" font-size="8" font-weight="bold">−</text><line x1="148" y1="60.09090909090909" x2="180" y2="64.0909090909091" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="170" cy="121.0909090909091" r="4.5" fill="white" stroke="#2e8b57" stroke-width="1.5"/><text x="170" y="124.0909090909091" text-anchor="middle" fill="#2e8b57" font-size="8" font-weight="bold">+</text><line x1="162" y1="120.0909090909091" x2="132" y2="117.0909090909091" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#ahg)"/><circle cx="250" cy="70.5909090909091" r="4.5" fill="#c0392b" stroke="none" stroke-width="1"/><text x="250" y="73.5909090909091" text-anchor="middle" fill="white" font-size="8" font-weight="bold">−</text><line x1="258" y1="72.5909090909091" x2="290" y2="76.5909090909091" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="280" cy="133.5909090909091" r="4.5" fill="white" stroke="#2e8b57" stroke-width="1.5"/><text x="280" y="136.5909090909091" text-anchor="middle" fill="#2e8b57" font-size="8" font-weight="bold">+</text><line x1="272" y1="132.5909090909091" x2="242" y2="129.5909090909091" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#ahg)"/><circle cx="360" cy="83.0909090909091" r="4.5" fill="#c0392b" stroke="none" stroke-width="1"/><text x="360" y="86.0909090909091" text-anchor="middle" fill="white" font-size="8" font-weight="bold">−</text><line x1="368" y1="85.0909090909091" x2="400" y2="89.0909090909091" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="390" cy="146.0909090909091" r="4.5" fill="white" stroke="#2e8b57" stroke-width="1.5"/><text x="390" y="149.0909090909091" text-anchor="middle" fill="#2e8b57" font-size="8" font-weight="bold">+</text><line x1="382" y1="145.0909090909091" x2="352" y2="142.0909090909091" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#ahg)"/><text x="280" y="178" text-anchor="middle" fill="#333" font-size="9.5">전자는 (+)극 쪽으로 "굴러 내려가고", 정공은 반대로 "떠오른다"</text><text x="280" y="195" text-anchor="middle" fill="#555" font-size="8.8">전기장은 전자를 가전자대→전도대로 들어 올리지 못한다. 들어 올리는 건 열(또는 빛), 움직이게 하는 건 전기장.</text></svg>