ight="bold">출력 = 1 (참)</text><rect x="100" y="155" width="20" height="40" rx="0" fill="white" fill-opacity="1" stroke="#555" stroke-width="0.8"/><rect x="85" y="170" width="50" height="10" rx="0" fill="#ccc" fill-opacity="1" stroke="#333" stroke-width="0.8"/><text x="170" y="179" text-anchor="start" fill="#888" font-size="9" font-weight="bold">NMOS 밸브: 닫힘</text><rect x="60" y="195" width="100" height="25" rx="0" fill="#ddd" fill-opacity="1" stroke="#777" stroke-width="0.8"/><text x="110" y="212" text-anchor="middle" fill="#333" font-size="9">GND = 하수구 (0)</text><line x1="110" y1="62" x2="110" y2="104" stroke="#2d6a9f" stroke-width="2" marker-end="url(#ahb)"/><text x="400" y="16" text-anchor="middle" fill="#1b3a5c" font-size="10.5" font-weight="bold">입력 1 → 출력 0</text><rect x="350" y="30" width="100" height="30" rx="0" fill="#cfe0f0" fill-opacity="1" stroke="#2d6a9f" stroke-width="0.8"/><text x="400" y="50" text-anchor="middle" fill="#1b3a5c" font-size="9">V<tspan baseline-shift="sub" font-size="75%">DD</tspan> = 물탱크 (1)</text><rect x="390" y="60" width="20" height="40" rx="0" fill="white" fill-opacity="1" stroke="#555" stroke-width="0.8"/><rect x="375" y="75" width="50" height="10" rx="0" fill="#ccc" fill-opacity="1" stroke="#333" stroke-width="0.8"/><text x="460" y="84" text-anchor="start" fill="#888" font-size="9" font-weight="bold">PMOS 밸브: 닫힘</text><rect x="365" y="100" width="70" height="55" rx="0" fill="white" fill-opacity="1" stroke="#333" stroke-width="1.2"/><text x="400" y="135" text-anchor="middle" fill="#c0392b" font-size="9.5" font-weight="bold">출력 = 0 (빔)</text><rect x="390" y="155" width="20" height="40" rx="0" fill="white" fill-opacity="1" stroke="#555" stroke-width="0.8"/><rect x="375" y="170" width="50" height="10" rx="0" fill="#2e8b57" fill-opacity="1" stroke="#333" stroke-width="0.8"/><text x="460" y="179" text-anchor="start" fill="#2e8b57" font-size="9" font-weight="bold">NMOS 밸브: 열림</text><rect x="350" y="195" width="100" height="25" rx="0" fill="#ddd" fill-opacity="1" stroke="#777" stroke-width="0.8"/><text x="400" y="212" text-anchor="middle" fill="#333" font-size="9">GND = 하수구 (0)</text><line x1="400" y1="150" x2="400" y2="197" stroke="#2d6a9f" stroke-width="2" marker-end="url(#ahb)"/><text x="290" y="240" text-anchor="middle" fill="#333" font-size="8.5">두 밸브는 같은 입력으로 움직이지만 성질이 반대라 항상 하나만 열린다 → 탱크와 하수구가 직접 이어지는 일이 없다</text></svg>