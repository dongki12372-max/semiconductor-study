 y="55" text-anchor="start" fill="#1b3a5c" font-size="9.5" font-weight="bold">전도대</text><text x="335" y="200" text-anchor="start" fill="white" font-size="9.5" font-weight="bold">가전자대</text><circle cx="440" cy="80" r="4.5" fill="#c0392b" stroke="none" stroke-width="1"/><text x="440" y="83" text-anchor="middle" fill="white" font-size="8" font-weight="bold">−</text><circle cx="440" cy="163" r="4.5" fill="white" stroke="#2e8b57" stroke-width="1.5"/><text x="440" y="166" text-anchor="middle" fill="#2e8b57" font-size="8" font-weight="bold">+</text><line x1="440" y1="155" x2="440" y2="96" stroke="#e08a1e" stroke-width="1.2" stroke-dasharray="3,2"/><text x="545" y="58" text-anchor="end" fill="#1b3a5c" font-size="8.3">결합에서 풀려나 결정 전체를</text><text x="545" y="70" text-anchor="end" fill="#1b3a5c" font-size="8.3">자유롭게 다니는 전자의 상태</text><text x="545" y="180" text-anchor="end" fill="white" font-size="8.3">결합에 묶인 전자들의 상태</text><text x="545" y="192" text-anchor="end" fill="white" font-size="8.3">(원래 꽉 참)</text><text x="440" y="228" text-anchor="middle" fill="#333" font-size="8.5">전도대는 "비어 있는 자리"다. 전자가 들어오면 그 전자가 전류를 나른다</text><text x="440" y="242" text-anchor="middle" fill="#555" font-size="8.3">(정공은 가전자대에서 전류를 나른다)</text></svg>